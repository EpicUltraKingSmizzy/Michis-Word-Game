name: Android release

# Push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to build
# a release APK and attach it to a GitHub release for that tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach the APK to
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Set up signing key (if configured)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
            } > android/key.properties
          else
            echo "::warning::No signing secrets set; the APK will be signed with a throwaway debug key."
          fi

      - name: Build APKs
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk universal.apk
          flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp universal.apk "michis-word-game-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "michis-word-game-${TAG}-arm64-v8a.apk"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Michis Word Game ${TAG}" --generate-notes
          fi
          gh release upload "$TAG" "michis-word-game-${TAG}.apk" "michis-word-game-${TAG}-arm64-v8a.apk" --clobber
